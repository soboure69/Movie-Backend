[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "films_sdk_sbre"
version = "0.0.3"
authors = [
  { name="Soboure BELLO" },
]
description = "SDK Python pour accéder à l’API MovieLens (Data Analysts/Data Scientists friendly)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
       'httpx>=0.28.1',
       'pydantic>=2.11.3',
       'backoff>=2.2.1',
       'numpy>=2.2.4',
       'pandas>=2.2.3',
       'python-dotenv',
]

[project.urls]
Homepage = "https://github.com/soboure69/Movie-Backend"
Repository = "https://github.com/soboure69/Movie-Backend"
Documentation = "https://github.com/soboure69/Movie-Backend/tree/main/sdk"
"API en ligne" = "https://movie-backend-x8iq.onrender.com/docs"
