# Lance les tests de l'API à chaque poussée et à chaque pull request.
name: Tests de l'API

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest
      - name: Lancer les tests
        run: pytest -q